<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GIP Reviewer</title>
<script>
  // Root entry: route based on auth state.
  // Authenticated users go to the dashboard; everyone else logs in first.
  (function () {
    var token = localStorage.getItem('azure_access_token');
    var expiry = parseInt(localStorage.getItem('azure_token_expiry') || '0', 10);
    var valid = token && (!expiry || Date.now() < expiry);
    window.location.replace(valid ? 'gip-dashboard.html' : 'login.html');
  })();
</script>
</head>
<body></body>
</html>
