<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GIP Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="env-config.js"></script>
<style>
  :root{
    --primary:#204496; --primary-2:#2e57b8; --primary-soft:#e8edf8;
    --bg:#f3f5fa; --card:#ffffff;
    --ink:#1a1f2e; --ink-soft:#5b6376; --ink-faint:#9aa1b2;
    --line:#e6e9f0; --line-soft:#eef1f7;
    --green:#1f8a52; --green-soft:#e4f3ea;
    --amber:#b8791a; --amber-soft:#fbf0db;
    --orange:#e14a28; --orange-soft:#fbe8e2;
    --side-bg:#0e1326; --side-bg-2:#111733;
    --side-text:#aab2c6; --side-text-hi:#ffffff;
    --side-line:#222a45;
    --accent:#4d82f0; --accent-soft:rgba(77,130,240,.14);
    --font:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 1s linear infinite;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#d3d8e4;border-radius:9px;}
  button{font-family:var(--font);cursor:pointer;}
  .shell{display:flex;height:100vh;}

  .sidebar{width:252px;flex-shrink:0;background:linear-gradient(180deg,var(--side-bg),var(--side-bg-2));
    display:flex;flex-direction:column;transition:width .22s ease;border-right:1px solid var(--side-line);}
  .sidebar.collapsed{width:74px;}
  .side-head{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;}
  .brand-logo{height:44px;width:auto;max-width:180px;object-fit:contain;flex-shrink:0;display:block;}
  .brand-icon{width:30px;height:30px;border-radius:8px;flex-shrink:0;background:transparent;border:none;padding:0;cursor:pointer;
    color:var(--side-text);display:none;align-items:center;justify-content:center;transition:background .15s,color .15s;}
  .brand-icon:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar.collapsed .brand-logo{display:none;}
  .sidebar.collapsed .brand-icon{display:flex;margin:0 auto;}
  .collapse-btn{margin-left:auto;width:30px;height:30px;border-radius:8px;border:none;
    background:transparent;color:var(--side-text);display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .collapse-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar.collapsed .side-head{justify-content:center;padding:18px 0 16px;}
  .sidebar.collapsed .collapse-btn{display:none;}
  .nav{flex:1;overflow-y:auto;padding:6px 12px;}
  .nav-label{font-size:10px;font-weight:700;color:var(--ink-faint);letter-spacing:.12em;text-transform:uppercase;padding:14px 10px 7px;}
  .sidebar.collapsed .nav-label{display:none;}
  .nav-item{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;
    border-radius:10px;border:none;background:transparent;color:var(--side-text);font-size:12px;font-weight:500;
    text-align:left;margin-bottom:3px;transition:all .15s;white-space:nowrap;overflow:hidden;text-decoration:none;}
  a.nav-item,a.nav-item:hover,a.nav-item:focus{text-decoration:none;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:var(--side-text-hi);}
  .nav-item.active{background:var(--accent-soft);color:#fff;font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .nav-item .ico{flex-shrink:0;display:flex;}
  .nav-item.active .ico{color:var(--accent);}
  .nav-item .lbl{overflow:hidden;text-overflow:ellipsis;}
  .sidebar.collapsed .nav-item{justify-content:center;padding:11px 0;}
  .sidebar.collapsed .nav-item .lbl{display:none;}
  .sidebar.collapsed .nav-item:hover::after{content:attr(data-label);position:absolute;left:calc(100% + 10px);
    top:50%;transform:translateY(-50%);background:#1c2340;color:#fff;font-size:12px;font-weight:500;
    padding:6px 10px;border-radius:7px;white-space:nowrap;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .side-foot{padding:10px 12px 14px;border-top:1px solid var(--side-line);}
  .foot-item{width:100%;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;
    border:none;background:transparent;color:var(--side-text);font-size:12px;font-weight:500;
    margin-bottom:2px;transition:all .15s;white-space:nowrap;overflow:hidden;}
  .foot-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  a.foot-item{text-decoration:none;}
  .foot-item .badge{margin-left:auto;background:var(--orange);color:#fff;font-size:9.5px;font-weight:700;
    min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .sidebar.collapsed .foot-item{justify-content:center;padding:9px 0;}
  .sidebar.collapsed .foot-item .lbl,.sidebar.collapsed .foot-item .badge{display:none;}
  .user{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-top:6px;border-radius:10px;
    background:rgba(255,255,255,.04);border:1px solid var(--side-line);transition:background .15s,border-color .15s;
    cursor:pointer;width:100%;text-align:left;border:none;font:inherit;}
  .user:hover{background:transparent;border-color:transparent;}
  .avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:var(--orange);color:#fff;
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .user-txt{overflow:hidden;white-space:nowrap;}
  .user-name{font-size:13px;font-weight:600;color:#fff;line-height:1.1;}
  .user-role{font-size:11px;color:var(--ink-faint);}
  .sidebar.collapsed .user{justify-content:center;padding:10px 0;}
  .sidebar.collapsed .user-txt,.sidebar.collapsed .user-caret{display:none;}
  .user-caret{margin-left:auto;color:var(--ink-faint);display:flex;align-items:center;transition:transform .15s;}
  .user-wrap{position:relative;}
  .user-pop{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);
    background:#1a2236;border:1px solid var(--side-line);border-radius:10px;
    box-shadow:0 12px 28px rgba(0,0,0,.45);padding:5px;display:none;z-index:50;}
  .user-pop.open{display:block;}
  .user-pop-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
    border:none;background:transparent;color:var(--side-text);font-size:12.5px;font-weight:500;
    border-radius:7px;cursor:pointer;text-align:left;text-decoration:none;}
  .user-pop-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .user-pop-item .ico{display:flex;align-items:center;color:var(--ink-faint);}
  .user-pop-sep{height:1px;background:var(--side-line);margin:4px 6px;}
  .sidebar.collapsed .user-pop{left:auto;right:-216px;bottom:6px;width:200px;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;
    background:var(--card);border-bottom:1px solid var(--line);}
  .topbar h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .topbar .date{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .platform-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(32,68,150,.18);}
  .platform-badge svg{flex-shrink:0;}
  .content{flex:1;overflow-y:auto;padding:26px 30px 40px;}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;position:relative;overflow:hidden;}
  .kpi .k-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:13px;}
  .kpi .k-val{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;}
  .kpi .k-lbl{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-top:6px;}
  .kpi .k-delta{font-size:11.5px;font-weight:600;margin-top:9px;display:inline-flex;align-items:center;gap:4px;}
  .kpi .k-life{position:absolute;top:14px;right:14px;background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:600;color:var(--ink-soft);}
  .kpi .k-life-val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;}
  .kpi .k-life-lbl{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);}

  /* autonomy panel */
  .autonomy-wrap{display:flex;flex-direction:column;gap:14px;padding:14px;}
  .ahero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    padding:22px 22px 20px;border-radius:12px;background:var(--bg);border:1px solid var(--line-soft);}
  .ahero-l{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .ahero-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--primary);background:var(--primary-soft);padding:4px 9px;border-radius:999px;align-self:flex-start;}
  .ahero-lbl{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:2px;}
  .ahero-val{font-size:46px;font-weight:800;letter-spacing:-.025em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ahero-sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .ahero-sub .delta{font-weight:700;}
  .ahero-r{flex-shrink:0;}
  .a-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .a-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;
    position:relative;display:flex;flex-direction:column;gap:6px;}
  .a-tile-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .a-tile-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .a-tile-spark{flex-shrink:0;opacity:.85;}
  .a-tile-val{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px;}
  .a-tile-lbl{font-size:12px;color:var(--ink-soft);font-weight:500;line-height:1.3;}
  .a-tile-delta{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;margin-top:2px;}
  .a-tile-delta.good{color:var(--green);}
  .a-tile-delta.bad{color:var(--orange);}
  .a-tile-delta.flat{color:var(--ink-faint);}

  /* notice mix donut */
  .tabs{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;}
  .tab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:5px 11px;border-radius:7px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .15s,color .15s;}
  .tab:hover{color:var(--ink);}
  .tab.active{background:var(--card);color:var(--primary);box-shadow:0 1px 3px rgba(15,25,55,.08);}
  .mix-wrap{padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;flex:1;}
  .mix-top{display:flex;align-items:center;gap:18px;flex:1;}
  .mix-donut-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;}
  .mix-donut{position:relative;width:180px;height:180px;flex-shrink:0;}
  .mix-range{font-size:10.5px;color:var(--ink-faint);font-weight:500;letter-spacing:.01em;white-space:nowrap;}
  .mix-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .mix-center-val{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
  .mix-center-lbl{font-size:10.5px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase;margin-top:4px;}
  .mix-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
  .mix-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
  .mix-swatch{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .mix-name{flex:1;color:var(--ink);font-weight:600;}
  .mix-val{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:600;}
  .mix-pct{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:11.5px;min-width:38px;text-align:right;}

  /* layout grid */
  .grid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin-top:18px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-soft);}
  .panel-head h3{font-size:15px;font-weight:700;margin:0;}
  .panel-body{padding:8px 12px 12px;}

  /* agent status */
  .ag{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;transition:background .15s;}
  .ag:hover{background:var(--bg);}
  .ag-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ag-ico svg{width:18px;height:18px;}
  .ag-main{flex:1;min-width:0;}
  .ag-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .ag-sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .ag-pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 8px 3px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .ag-pill.run{background:var(--green-soft);color:var(--green);}
  .ag-pill.stop{background:#eef1f7;color:var(--ink-soft);}
  .ag-pill.warn{background:var(--amber-soft);color:var(--amber);}
  .ag-dot{width:7px;height:7px;border-radius:50%;background:currentColor;position:relative;}
  .ag-pill.run .ag-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:currentColor;animation:pulse-ring 1.6s ease-out infinite;}
  @keyframes pulse-ring{0%{transform:scale(1);opacity:.55;}80%{transform:scale(2.6);opacity:0;}100%{transform:scale(2.6);opacity:0;}}
  .ag-pill.run .ag-dot{animation:pulse-core 1.6s ease-in-out infinite;}
  @keyframes pulse-core{0%,100%{opacity:1;}50%{opacity:.6;}}
</style>
</head>
<body>
<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <img class="brand-logo" src="assets/logo_white.png" alt="GIP" />
      <button class="brand-icon" id="brandIcon" title="Expand menu" aria-label="Expand menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <button class="collapse-btn" id="collapseBtn" title="Collapse">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div id="footItems"></div>
      <div class="user-wrap">
        <button class="user" id="userBtn" aria-haspopup="true" aria-expanded="false">
          <div class="avatar" id="userAvatar">A</div>
          <div class="user-txt">
            <div class="user-name" id="userName">Austin</div>
            <div class="user-role" id="userRole">admin</div>
          </div>
          <span class="user-caret"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></span>
        </button>
        <div class="user-pop" id="userPop" role="menu">
          <a class="user-pop-item" href="help.html" role="menuitem">
            <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg></span>
            Help
          </a>
          <div class="user-pop-sep"></div>
          <a class="user-pop-item" href="login.html" role="menuitem">
            <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
            Logout
          </a>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <div class="date" id="pageDate"></div>
      </div>
      <div class="top-actions">
        <span class="platform-badge" title="GCM AI Platform">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          GCM AI Platform
        </span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
const ICONS = {
  dashboard:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>',
  notice:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13l1.5 1.5L13 12"/></svg>',
  compliance:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 11.5 11 13.5 15 9.5"/></svg>',
  filing:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>',
  agentops:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>',
  email:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  assistant:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  file:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',

function topNWithOther(data, n){
  const sorted = [...data].sort((a,b)=>b.count-a.count);
  if(sorted.length <= n) return sorted.map((d,i)=>({...d,color:MIX_COLORS[i]}));
  const head = sorted.slice(0,n).map((d,i)=>({...d,color:MIX_COLORS[i]}));
  const tail = sorted.slice(n);
  const otherCount = tail.reduce((a,d)=>a+d.count,0);
  if(otherCount > 0) head.push({type:'Other',count:otherCount,color:'var(--ink-faint)',_members:tail.map(t=>t.type)});
  return head;
}

function frameRange(frame, now){
  const d = now || new Date();
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day=d.getDate(), mo=d.getMonth(), yr=d.getFullYear();
  const fmt=(m,dd)=>`${M[m]} ${dd}`;
  if(frame==='day') return `${fmt(mo,day)}, ${yr}`;
  if(frame==='mtd') return `${fmt(mo,1)} – ${fmt(mo,day)}, ${yr}`;
  return `${fmt(0,1)} – ${fmt(mo,day)}, ${yr}`;
}

function donut(data, size){
  const S=size||140, R=S/2, IN=R-24, OUT=R-2;
  const total = data.reduce((a,d)=>a+d.count,0) || 1;
  let acc=-Math.PI/2;
  const arcs = data.map(d=>{
    const a0=acc, a1=acc+(d.count/total)*Math.PI*2; acc=a1;
    const lg=(a1-a0)>Math.PI?1:0;
    const x0o=R+OUT*Math.cos(a0),y0o=R+OUT*Math.sin(a0);
    const x1o=R+OUT*Math.cos(a1),y1o=R+OUT*Math.sin(a1);
    const x0i=R+IN*Math.cos(a1), y0i=R+IN*Math.sin(a1);
    const x1i=R+IN*Math.cos(a0), y1i=R+IN*Math.sin(a0);
    return `<path d="M ${x0o},${y0o} A ${OUT},${OUT} 0 ${lg} 1 ${x1o},${y1o} L ${x0i},${y0i} A ${IN},${IN} 0 ${lg} 0 ${x1i},${y1i} Z" fill="${d.color}"><title>${d.type}: ${d.count}</title></path>`;
  }).join('');
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${arcs}</svg>`;
}

function sparkline(series, color, w, h){
  const W=w||70, H=h||22, P=2;
  const lo=Math.min(...series), hi=Math.max(...series), span=hi-lo||1;
  const pts = series.map((v,i)=>`${(P+(i*(W-2*P))/(series.length-1)).toFixed(1)},${(H-P-((v-lo)/span)*(H-2*P)).toFixed(1)}`).join(' ');
  return `<svg class="a-tile-spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polyline fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`;
}

function deltaTone(pts, dir){
  if(pts===0) return {cls:'flat',icon:ICONS.arrowFlat};
  const up=pts>0, good=(dir==='higher-is-better')?up:!up;
  return {cls:good?'good':'bad', icon:up?ICONS.arrowUp:ICONS.arrowDown};
}

/* ── API fetch ── */
async function _dashFetch(path){
  const base = window.GIP_CONFIG ? (window.GIP_CONFIG.API_BASE || '') : null;
  if(base === null) return null;
  const t = localStorage.getItem('azure_access_token');
  try{
    const r = await fetch(`${base}${path}`, { headers: t ? {Authorization:'Bearer '+t} : {} });
    if(r.status===401){ window.location.href='login.html'; return null; }
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

async function loadMetrics(){
  const data = await _dashFetch('/api/review/metrics');
  if(data){ METRICS = data; renderPage(); }
}

async function loadQueueData(){
  const data = await _dashFetch('/api/review/queue');
  if(!data) return;
  QUEUE_DATA = data;
  renderPage();
}

  if(!btn||!pop) return;
  const close=()=>{ pop.classList.remove('open'); btn.setAttribute('aria-expanded','false'); };
  btn.addEventListener('click', e=>{ e.stopPropagation(); const on=pop.classList.toggle('open'); btn.setAttribute('aria-expanded',on); });
  document.addEventListener('click', e=>{ if(!pop.classList.contains('open')) return; if(!pop.contains(e.target)&&!btn.contains(e.target)) close(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
})();

    const name = u.display_name || u.username || 'User';
    const role = u.role || 'reviewer';
    const el = document.getElementById('userName');
    const ra = document.getElementById('userRole');
    const av = document.getElementById('userAvatar');
    if(el) el.textContent = name;
    if(ra) ra.textContent = role;
    if(av) av.textContent = name.charAt(0).toUpperCase();
  }catch(e){}
})();

document.getElementById('pageDate').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

if(!localStorage.getItem('azure_access_token')) window.location.href='login.html';
renderNav();
renderFoot();
renderPage();
loadQueueData();
loadMetrics();
</script>
</body>
</html>
